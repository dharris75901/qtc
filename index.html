<style>

textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

.btn{font:inherit;font-weight:600;padding:12px 18px;min-height:46px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);width:100%}
.empty{color:var(--mute);margin:0}

.rules{padding-left:22px;margin:0 0 12px}.rules li{margin:0 0 8px}
.card p{margin:0 0 10px}
.book>summary{cursor:pointer;font-weight:600;font-size:1.05rem;min-height:44px;display:flex;align-items:center;list-style:none}
.book>summary::-webkit-details-marker{display:none}
.book>summary::after{content:'\25B8';margin-left:auto;color:var(--mute)}
.book[open]>summary::after{content:'\25BE'}
.book[open]>summary{margin-bottom:6px}
.esv{display:inline-block;color:var(--accent);font-weight:600;min-height:44px;line-height:44px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;font:inherit;font-size:.7rem;line-height:1.2;padding:6px 2px;min-height:56px;background:none;border:0;color:var(--mute)}
.tabs button[aria-current=true]{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.saved{color:var(--mute);font-size:.8rem;margin:6px 0 0;min-height:1.2em}
</style>
</head>

function otplan(){return planPage({t:LABELS.ot,books:OT,dk:'odone',nk:'ot-',ip:'o',sub:'Three chapters a day, and two a day for Job, Psalms, Proverbs, Ecclesiastes, Song of Solomon, Lamentations and Daniel.'})}
var QT_STORY=[`Early every morning, before everyone gets up, when no one is stirring, not even a mouse, I wake up and get out of bed. I make my coffee, feed my dogs, and make my way to the place. The place is a small office in the backyard with a comfortable chair, a small table, and pictures of my kids and family on the wall. I take my phone, which is set to “do not disturb,” and my email is set to “out of office.” I use an app on my phone to help guide me and journal my time with Jesus as I read the Bible and spend time alone with God. I have learned that if I don't take these precautions, the phone will ring, the text will come, or the email will notify. All at exactly the wrong time, and none of it important. I do this routine every morning on purpose, because I have a mission and I have a plan to fulfill that mission. The mission is to become a better Christian man. The plan is to spend time with the One who created me and knows exactly how to make me a better Christian man.`,
`Today, I am reading Proverbs chapter 3. Having just turned 61 and recently suffered a major heart attack, I reflect on verses 1 and 2: “My son, do not forget my teaching, but let your heart keep my commandments, for length of days and years of life and peace they will add to you.” What a timely message for me, coming off major heart surgery and a traumatic event in which I passed away three times on the way to the hospital. At 60 years of age. A not-so-old man. Reading this, I think to myself, “Did God just write this yesterday so that it would apply to me today? Why am I just happening to read this today? Isn't it amazing how God's Word jumps out of time and space into the reality of our lives today?” I jot these things down in my journal. I look up at the wall, see a picture of my son, and it prompts me to pray: “Lord Jesus, may You be glorified in Stephen's life. May he understand the importance of remembering Your teaching and Your words, so that peace will be added to his life. Thank You, Jesus, for making a way for us to build forever families. I get to be Your son and see You face to face one day. I get to see my dad again, I get to see my son when we both get to heaven, and I get to see great-grandsons I may never have seen on this earth and in this life. That is what gives me peace. Amen.” I take a couple more sips of coffee, go back to the house, and begin my day in peace and tranquility.`,
`As I hop in the truck and head down the road to work, I reminisce about life. How did I form this habit of getting up so early in the morning and reading the Bible? Who taught me to do this? Was it my youth minister? My pastor? The first person who taught me this was my dad. He didn't sit me down and tell me exactly how to do it. He just did it. I can't remember a time I ever got up before him. Even when I was going fishing or hunting, he was always up first. I remember that every time I walked out of my room and into the living room, no matter how early, he would be setting his Bible down on the table with his notebook and pen. Later in life, my youth minister taught me more about how to have a plan and how to approach this time alone with God. But the discipline, the time, the example — that was modeled for me, and I saw it in my father's life.`];
var QT_INTRO=`I've developed this application to help others have a plan to succeed in their mission to become a better Christian man or a better Christian woman. I hope it helps you develop and grow. I hope it doesn't become a crutch, but just a tool to get you started on a lifelong journey with Jesus. Here are some key things about the Quiet Time Challenge:`;
var QT_KEYS=[`Find a place that is free from accidental and purposeful distractions. Make sure your phone, TV, kids, computer, etc., can't interrupt you.`,`Get up early. Make it the first thing you do in the morning.`,`Make it a holy, solemn commitment. Will it.`,`Make sure your spouse and kids know: This is my time with God. You don't interrupt me, and I won't interrupt you. I help you guard your time, and you help me guard my time.`,`Don't make it a lengthy Bible study. It's a focused, short time. It's about daily discipline and commitment.`,`Don't make it about you. Make it about Him. Don't read to call attention to what you need to do about yourself and all your sin. Read to figure out who He is. How mighty is He? How gracious is He? How loving is He? How holy is He? How precious is He? How just is He?`];
function infoCard(k,title,kids){
  var d=h('details',{class:'card book'},[h('summary',{text:title})]);
  if(openB[k]!==false)d.setAttribute('open','');
  d.addEventListener('toggle',function(){openB[k]=d.open});
  kids.forEach(function(c){d.appendChild(c)});
  return d;
}
function qtPage(){
  var box=document.createDocumentFragment();
  var bk=h('button',{class:'rules-link',type:'button',text:'‹ Back',style:'margin-left:0'});bk.onclick=function(){tab=back;render()};
  box.appendChild(bk);
  box.appendChild(h('h2',{class:'ptitle',text:'Quiet Times'}));
  box.appendChild(infoCard('qt-story','My Quiet Time',QT_STORY.map(function(t){return h('p',{text:t})})));
  box.appendChild(infoCard('qt-keys','The Quiet Time Challenge',[h('p',{text:QT_INTRO}),h('ol',{class:'rules'},QT_KEYS.map(function(t){return h('li',{text:t})}))]));
  var list=data.qt||[];
  if(!list.length)box.appendChild(h('p',{class:'empty',text:'No entries yet. Your saved quiet times will appear here.'}));
  list.forEach(function(e){
    var when=new Date(e.ts).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    var del=h('button',{class:'rules-link',type:'button',text:'Delete',style:'margin:8px 0 0;min-height:40px;font-size:.8rem'});
    var armed=false;
    del.onclick=function(){if(!armed){armed=true;del.textContent='Tap again to delete';return}data.qt=data.qt.filter(function(q){return q.id!==e.id});save();render()};
    box.appendChild(h('div',{class:'card'},[h('h2',{text:when}),h('p',{text:e.text,style:'white-space:pre-wrap;margin:0'}),del]));
  });
  return box;
}
function prayer(){
  var k=key(cur),dw=cur.getDay(),box=head(LABELS.prayer);
  var list=data.people.filter(function(p){return p.days.indexOf(dw)>-1}),done=data.prayed[k]||[];
  var pc=h('div',{class:'card'},[h('h2',{text:'Pray for today ('+DAYS[dw]+')'})]);
  if(!list.length)pc.appendChild(h('p',{class:'empty',text:'No one is assigned to '+DAYS[dw]+' yet. Add people below.'}));
  list.forEach(function(p){
    var on=done.indexOf(p.id)>-1,id='c'+p.id;
    var cb=h('input',{type:'checkbox',id:id});cb.checked=on;
    cb.onchange=function(){var a=data.prayed[k]||[];a=a.filter(function(x){return x!==p.id});if(cb.checked)a.push(p.id);data.prayed[k]=a;save()};
    var row=h('div',{class:'row'},[cb,h('label',{for:id,text:p.name})]);pc.appendChild(row);
  });
  box.appendChild(pc);
  box.appendChild(people());
  return box;
}
function people(){
  var box=document.createDocumentFragment();
  box.appendChild(h('h2',{text:'Add people',style:'margin-top:28px'}));
  box.appendChild(h('p',{class:'sub',text:'Add a name and choose the days you want to pray for them.'}));
  var name=h('input',{type:'text','aria-label':'Name',placeholder:'Name',autocomplete:'off'});
  var chips=h('div',{class:'chips'});
  DAYS.forEach(function(d,i){
    var b=h('button',{class:'chip',type:'button','aria-pressed':pick.indexOf(i)>-1?'true':'false',text:d.slice(0,3),'aria-label':d});
    b.onclick=function(){var j=pick.indexOf(i);if(j>-1)pick.splice(j,1);else pick.push(i);b.setAttribute('aria-pressed',j>-1?'false':'true')};
    chips.appendChild(b);
  });
  var err=h('p',{class:'saved'});
  var add=h('button',{class:'btn',type:'button',text:'Add person'});
  add.onclick=function(){
    var n=name.value.trim();
    if(!n){err.textContent='Enter a name.';return}
    if(!pick.length){err.textContent='Choose at least one day.';return}
    data.people.push({id:Date.now()+Math.floor(Math.random()*1000),name:n,days:pick.slice().sort()});
    pick=[];save();render();
  };
  box.appendChild(h('div',{class:'card',style:'margin-top:16px'},[name,chips,add,err]));
  DAYS.forEach(function(d,i){
    var l=data.people.filter(function(p){return p.days.indexOf(i)>-1});
    if(!l.length)return;
    var c=h('div',{class:'card'},[h('h2',{text:d})]);
    l.forEach(function(p){
      var x=h('button',{class:'x','aria-label':'Remove '+p.name+' from '+d,text:'\u00d7'});
      x.onclick=function(){p.days=p.days.filter(function(v){return v!==i});if(!p.days.length)data.people=data.people.filter(function(q){return q!==p});save();render()};
      c.appendChild(h('div',{class:'row'},[h('span',{style:'flex:1',text:p.name}),x]));
    });
    box.appendChild(c);
  });
  return box;
}
function render(){
  var a=document.getElementById('app');a.textContent='';
  a.appendChild(tab==='quiet'?quiet():tab==='gospel'?gospel():tab==='nt'?ntplan():tab==='ot'?otplan():tab==='qt'?qtPage():tab==='rules'?rules():prayer());
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){
    if(b.dataset.t===tab)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');
    b.textContent=TABS[b.dataset.t];
  });
  window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
render();
</script>
</body>
