<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prayer Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Prayer Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: a pocket breviary — one column of text, rubrics in red, tabs at the thumb */
:root{
  --paper:#F3F8FD; --leaf:#E2EEF9; --ink:#1B2B3C; --muted:#5A6D82; --rule:#C8DAEC;
  --rubric:#2C6AA6; --gilt:#8F6B22;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1A26; --leaf:#192838; --ink:#E5EEF7; --muted:#9AB0C6; --rule:#2A3D52;
  --rubric:#86BDEE; --gilt:#D6B46C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A26; --leaf:#192838; --ink:#E5EEF7; --muted:#9AB0C6; --rule:#2A3D52;
  --rubric:#86BDEE; --gilt:#D6B46C; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--rubric)}
:focus-visible{outline:2px solid var(--rubric);outline-offset:2px;border-radius:4px}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.brand{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);margin-bottom:6px}
.sizer{display:flex;gap:4px}
.sizer button{width:38px;height:38px;border:1px solid var(--rule);border-radius:8px;font-family:var(--serif);font-size:17px}
.sizer button:last-child{font-size:22px}

h2.sec{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 4px;text-wrap:balance}
p.lede{margin:0 0 16px;color:var(--muted);line-height:1.5}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.item .num{font-family:var(--serif);color:var(--rubric);font-size:22px;min-width:40px;font-variant-numeric:tabular-nums}
.item .body{flex:1;min-width:0}
.item .t{font-family:var(--serif);font-size:20px;line-height:1.2}
.item .s{font-size:13.5px;color:var(--muted);margin-top:3px}
.item .star{color:var(--gilt);font-size:18px}
.item .chev{color:var(--muted)}

.today{background:var(--leaf);border-radius:12px;padding:14px 14px 12px;margin-bottom:6px}
.today .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);font-family:var(--serif);font-size:18px;text-decoration:none;color:var(--ink)}
.pill.ext::after{content:"↗";font-family:var(--sans);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid a,.grid button{display:flex;align-items:center;justify-content:center;height:40px;border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums;text-decoration:none;color:var(--muted);border:1px solid var(--rule)}
.grid button{color:var(--paper);background:var(--rubric);border-color:var(--rubric);font-weight:600}

.namebox{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.namebox label{font-size:13px;color:var(--muted)}
.namebox input{font:inherit;font-size:17px;padding:11px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}

.ourfather{font-family:var(--serif);font-size:calc(21px*var(--scale));line-height:1.6;background:var(--leaf);border-radius:12px;padding:18px}
.ourfather .ref{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{padding:12px 18px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--rule)}
.btn.primary{background:var(--rubric);color:var(--paper);border-color:var(--rubric)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs a .g{font-family:var(--serif);font-size:21px;line-height:1}
nav.tabs a[aria-current="page"]{color:var(--rubric)}

/* Reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.rbar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px);}
.rbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.rbar button{padding:8px 10px;border-radius:8px;font-size:15px;font-weight:500}
.rbar .fav{color:var(--gilt);font-size:20px}
.rbody{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 80px}
.rbody h1{font-family:var(--serif);font-weight:500;font-size:calc(30px*var(--scale));line-height:1.15;margin:0;text-wrap:balance}
.rbody .src{color:var(--rubric);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin:0 0 8px}
.rubric{font-family:var(--serif);font-style:italic;color:var(--rubric);font-size:calc(17px*var(--scale));line-height:1.5;margin:14px 0}
.text{font-family:var(--serif);font-size:calc(21px*var(--scale));line-height:1.62;margin-top:18px}
.text p{margin:0 0 .8em;max-width:34em}
.text p.first::first-letter{float:left;font-size:3.3em;line-height:.85;padding:.06em .08em 0 0;color:var(--rubric);font-weight:500}
.text sup{color:var(--rubric);font-family:var(--sans);font-size:.55em;font-weight:600;margin-right:.25em;vertical-align:.5em}
.mode{display:inline-flex;border:1px solid var(--rule);border-radius:10px;padding:3px;margin-top:16px}
.mode button{padding:8px 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.versions{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.versions a{text-decoration:none;font-weight:600}

.step{margin-top:22px}
.step .prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em;text-transform:uppercase}
.bar{height:3px;background:var(--rule);border-radius:2px;margin:8px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rubric);transition:width .25s}
.step .theme{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gilt)}
.step .big{font-family:var(--serif);font-size:calc(26px*var(--scale));line-height:1.4;margin:8px 0 6px}
.step .guide{font-size:calc(16.5px*var(--scale));line-height:1.55;color:var(--ink);background:var(--leaf);padding:14px 16px;border-radius:10px;margin-top:14px}
.step .guide b{color:var(--rubric);font-weight:600}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.stepnav .btn{flex:1}
.amen{text-align:center;padding:40px 0 10px}
.amen .a{font-family:var(--serif);font-size:44px;color:var(--rubric);font-style:italic}

/* Prayer list */
nav.tabs .in{grid-template-columns:repeat(6,1fr)}
nav.tabs a{font-size:11.5px;padding-inline:2px;white-space:nowrap}
.seg{margin:0 0 18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border:1px solid var(--rule);border-radius:10px;font-size:13px;color:var(--muted)}
.day b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.day.today span{color:var(--rubric);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-pressed="true"] b,.day[aria-pressed="true"] span{color:var(--paper)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.count{font-family:var(--serif);font-size:22px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--leaf);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:var(--rubric);flex:none}
.avatar.grp{border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--leaf);color:var(--muted)}
.empty{background:var(--leaf);border-radius:12px;padding:22px 18px}
.empty .big{font-family:var(--serif);font-size:24px}
.empty p{color:var(--muted);line-height:1.5;margin:6px 0 14px}
.addbtn{width:100%;margin-top:14px;border-style:dashed;color:var(--rubric)}
.savenote{font-size:13px;color:var(--muted);margin-top:22px;text-align:center}
.cats{border-top:1px solid var(--rule)}
.cat{border-bottom:1px solid var(--rule)}
.cathead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;padding:14px 2px}
.cathead .t{font-family:var(--serif);font-size:20px}
.cathead .s{grid-column:1;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cathead .chev{grid-column:2;grid-row:1/3;align-self:center;font-size:22px;color:var(--rubric)}
.catbody{padding:0 2px 18px;display:flex;flex-direction:column;gap:10px}
.verse{background:var(--leaf);border-radius:10px;padding:12px 14px}
.vref{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rubric)}
.vtext{font-family:var(--serif);font-size:18px;line-height:1.5;margin-top:4px}
.rm{font-size:13px;color:var(--muted);margin-top:6px;padding:4px 0;text-decoration:underline}
.form,.addv{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.form label,.addv label,.flabel{font-size:13px;color:var(--muted);font-weight:600;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.form input,.addv input,.form textarea,.addv textarea{font:inherit;font-size:17px;padding:11px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);width:100%}
.form textarea,.addv textarea{resize:vertical;font-family:var(--serif);font-size:18px}
.linkish{color:var(--rubric);font-size:13px;font-weight:600}
.btn.danger{color:var(--rubric);border-color:var(--rubric)}
.btn.ghost{border-color:transparent;color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.err{color:var(--rubric);font-size:14px;margin:0}
.ask{margin-top:22px}
.asklabel{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gilt)}
.ask blockquote{margin:6px 0 0;font-family:var(--serif);font-size:calc(20px*var(--scale));line-height:1.5}
.ask blockquote+blockquote{margin-top:14px}
.mode{flex-wrap:wrap;max-width:100%}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--rubric)}
.preview{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5;padding:12px;border-radius:10px;border:1px solid var(--rule);background:var(--leaf);color:var(--ink);resize:vertical;white-space:pre;overflow:auto}
.prayerbox{margin-top:14px;border:1.5px solid var(--gilt);border-radius:12px;padding:14px 16px;background:var(--leaf)}
.prayerbox .pl{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);margin-bottom:6px}
.prayerbox .pt{font-family:var(--serif);font-size:calc(20px*var(--scale));line-height:1.45}
.ask+.ask{padding-top:20px;border-top:1px solid var(--rule)}
.ask cite{display:block;font-style:normal;font-family:var(--sans);font-size:13px;color:var(--rubric);margin-top:4px;font-weight:600}

/* Home */
.hero{text-align:center;margin:4px 0 22px}
.hero img{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:0 6px 18px rgba(30,70,120,.18)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:0;line-height:1.1}
.hero p{margin:6px 0 0;color:var(--muted)}
.pick{display:block;text-decoration:none;color:var(--ink);background:var(--leaf);border:1px solid var(--rule);border-left:4px solid var(--gilt);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.pick b{display:block;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.2}
.pick span{display:block;color:var(--muted);font-size:14.5px;line-height:1.4;margin-top:3px}
.pick em{display:block;font-style:normal;color:var(--rubric);font-size:13.5px;font-weight:600;margin-top:6px}
body[data-page="home"] header.top .brand{visibility:hidden}
body[data-page="home"] header.top{border-bottom-color:transparent;margin-bottom:0}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <a class="brand" href="#home" style="color:inherit;text-decoration:none"><small>Daily Office</small>Prayer Book</a>
    <div class="sizer" aria-label="Text size">
      <button id="smaller" aria-label="Smaller text">A</button>
      <button id="larger" aria-label="Larger text">A</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <a href="#home" data-tab="home"><span class="g">⌂</span>Home</a>
  <a href="#prayers" data-tab="prayers"><span class="g">✠</span>Prayers</a>
  <a href="#psalms" data-tab="psalms"><span class="g">ψ</span>Psalms</a>
  <a href="#ourfather" data-tab="ourfather"><span class="g">☩</span>Our Father</a>
  <a href="#paul" data-tab="paul"><span class="g">✉</span>Paul</a>
  <a href="#list" data-tab="list"><span class="g">☷</span>My List</a>
</div></nav>

<div class="reader" id="reader" hidden>
  <div class="rbar"><div class="in">
    <button id="back">‹ Back</button>
    <button class="fav" id="fav" aria-label="Save to favorites">☆</button>
  </div></div>
  <div class="rbody" id="rbody"></div>
</div>

<script>
/* ---------- Text (KJV and historic public-domain prayers) ---------- */
const PRAYERS = [
 {id:"jesus",title:"The Jesus Prayer",src:"Eastern Church, ancient",tags:["Confession","Short"],
  rub:"Pray slowly, in rhythm with your breathing. Repeat as long as you like.",
  text:["Lord Jesus Christ, Son of God, have mercy on me, a sinner."]},
 {id:"purity",title:"Collect for Purity",src:"Book of Common Prayer, 1662",tags:["Historic","Morning"],
  text:["Almighty God, unto whom all hearts be open, all desires known, and from whom no secrets are hid: Cleanse the thoughts of our hearts by the inspiration of thy Holy Spirit, that we may perfectly love thee, and worthily magnify thy holy Name; through Christ our Lord. Amen."]},
 {id:"grace",title:"A Collect for Grace",src:"Book of Common Prayer, 1662 · Morning Prayer",tags:["Historic","Morning"],
  text:["O Lord, our heavenly Father, Almighty and everlasting God, who hast safely brought us to the beginning of this day: Defend us in the same with thy mighty power; and grant that this day we fall into no sin, neither run into any kind of danger; but that all our doings may be ordered by thy governance, to do always that is righteous in thy sight; through Jesus Christ our Lord. Amen."]},
 {id:"lighten",title:"Lighten Our Darkness",src:"Book of Common Prayer, 1662 · Evening Prayer",tags:["Historic","Evening","Short"],
  text:["Lighten our darkness, we beseech thee, O Lord; and by thy great mercy defend us from all perils and dangers of this night; for the love of thy only Son, our Saviour, Jesus Christ. Amen."]},
 {id:"thanks",title:"The General Thanksgiving",src:"Book of Common Prayer, 1662",tags:["Historic","Thanks"],
  text:["Almighty God, Father of all mercies, we thine unworthy servants do give thee most humble and hearty thanks for all thy goodness and loving-kindness to us, and to all men.",
  "We bless thee for our creation, preservation, and all the blessings of this life; but above all for thine inestimable love in the redemption of the world by our Lord Jesus Christ; for the means of grace, and for the hope of glory.",
  "And, we beseech thee, give us that due sense of all thy mercies, that our hearts may be unfeignedly thankful, and that we shew forth thy praise, not only with our lips, but in our lives; by giving up ourselves to thy service, and by walking before thee in holiness and righteousness all our days; through Jesus Christ our Lord, to whom with thee and the Holy Ghost be all honour and glory, world without end. Amen."]},
 {id:"francis",title:"Make Me an Instrument of Your Peace",src:"Prayer attributed to St. Francis · first printed 1912",tags:["Historic"],
  text:["Lord, make me an instrument of your peace; where there is hatred, let me sow love; where there is injury, pardon; where there is doubt, faith; where there is despair, hope; where there is darkness, light; and where there is sadness, joy.",
  "O Divine Master, grant that I may not so much seek to be consoled as to console; to be understood as to understand; to be loved as to love.",
  "For it is in giving that we receive; it is in pardoning that we are pardoned; and it is in dying that we are born to eternal life. Amen."]},
 {id:"patrick",title:"Christ Be With Me",src:"St. Patrick's Breastplate · tr. C. F. Alexander, 1889",tags:["Historic","Morning"],
  text:["Christ be with me, Christ within me, Christ behind me, Christ before me, Christ beside me, Christ to win me, Christ to comfort and restore me.",
  "Christ beneath me, Christ above me, Christ in quiet, Christ in danger, Christ in hearts of all that love me, Christ in mouth of friend and stranger."]},
 {id:"wesley",title:"The Covenant Prayer",src:"John Wesley's Covenant Service, 1780",tags:["Historic","Surrender"],
  text:["I am no longer my own, but thine. Put me to what thou wilt, rank me with whom thou wilt. Put me to doing, put me to suffering. Let me be employed for thee or laid aside for thee, exalted for thee or brought low for thee.",
  "Let me be full, let me be empty. Let me have all things, let me have nothing. I freely and heartily yield all things to thy pleasure and disposal.",
  "And now, O glorious and blessed God, Father, Son, and Holy Spirit, thou art mine, and I am thine. So be it. And the covenant which I have made on earth, let it be ratified in heaven. Amen."]},
 {id:"augustine",title:"Our Heart Is Restless",src:"St. Augustine, Confessions I.1 · tr. E. B. Pusey",tags:["Historic","Short"],
  text:["Great art Thou, O Lord, and greatly to be praised. Thou awakest us to delight in Thy praise; for Thou madest us for Thyself, and our heart is restless, until it repose in Thee."]},
 {id:"doxology",title:"The Doxology",src:"Thomas Ken, 1674",tags:["Historic","Thanks","Short"],

 {id:"jabez",title:"The Prayer of Jabez",src:"1 Chronicles 4:10",tags:["Scripture","Short"],

const PSALMS = [
 {n:1,t:"The two ways",tag:"Wisdom",v:["Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful.","But his delight is in the law of the LORD; and in his law doth he meditate day and night.","And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper.","The ungodly are not so: but are like the chaff which the wind driveth away.","Therefore the ungodly shall not stand in the judgment, nor sinners in the congregation of the righteous.","For the LORD knoweth the way of the righteous: but the way of the ungodly shall perish."]},
 {n:8,t:"How excellent is thy name",tag:"Praise",v:["O LORD our Lord, how excellent is thy name in all the earth! who hast set thy glory above the heavens.","Out of the mouth of babes and sucklings hast thou ordained strength because of thine enemies, that thou mightest still the enemy and the avenger.","When I consider thy heavens, the work of thy fingers, the moon and the stars, which thou hast ordained;","What is man, that thou art mindful of him? and the son of man, that thou visitest him?","For thou hast made him a little lower than the angels, and hast crowned him with glory and honour.","Thou madest him to have dominion over the works of thy hands; thou hast put all things under his feet:","All sheep and oxen, yea, and the beasts of the field;","The fowl of the air, and the fish of the sea, and whatsoever passeth through the paths of the seas.","O LORD our Lord, how excellent is thy name in all the earth!"]},
 {n:19,t:"The heavens declare",tag:"Praise",v:["The heavens declare the glory of God; and the firmament sheweth his handywork.","Day unto day uttereth speech, and night unto night sheweth knowledge.","There is no speech nor language, where their voice is not heard.","Their line is gone out through all the earth, and their words to the end of the world. In them hath he set a tabernacle for the sun,","Which is as a bridegroom coming out of his chamber, and rejoiceth as a strong man to run a race.","His going forth is from the end of the heaven, and his circuit unto the ends of it: and there is nothing hid from the heat thereof.","The law of the LORD is perfect, converting the soul: the testimony of the LORD is sure, making wise the simple.","The statutes of the LORD are right, rejoicing the heart: the commandment of the LORD is pure, enlightening the eyes.","The fear of the LORD is clean, enduring for ever: the judgments of the LORD are true and righteous altogether.","More to be desired are they than gold, yea, than much fine gold: sweeter also than honey and the honeycomb.","Moreover by them is thy servant warned: and in keeping of them there is great reward.","Who can understand his errors? cleanse thou me from secret faults.","Keep back thy servant also from presumptuous sins; let them not have dominion over me: then shall I be upright, and I shall be innocent from the great transgression.","Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer."]},
 {n:23,t:"The Lord is my shepherd",tag:"Trust",v:["The LORD is my shepherd; I shall not want.","He maketh me to lie down in green pastures: he leadeth me beside the still waters.","He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.","Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.","Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever."]},
 {n:27,t:"My light and my salvation",tag:"Trust",v:["The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","When the wicked, even mine enemies and my foes, came upon me to eat up my flesh, they stumbled and fell.","Though an host should encamp against me, my heart shall not fear: though war should rise against me, in this will I be confident.","One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to enquire in his temple.","For in the time of trouble he shall hide me in his pavilion: in the secret of his tabernacle shall he hide me; he shall set me up upon a rock.","And now shall mine head be lifted up above mine enemies round about me: therefore will I offer in his tabernacle sacrifices of joy; I will sing, yea, I will sing praises unto the LORD.","Hear, O LORD, when I cry with my voice: have mercy also upon me, and answer me.","When thou saidst, Seek ye my face; my heart said unto thee, Thy face, LORD, will I seek.","Hide not thy face far from me; put not thy servant away in anger: thou hast been my help; leave me not, neither forsake me, O God of my salvation.","When my father and my mother forsake me, then the LORD will take me up.","Teach me thy way, O LORD, and lead me in a plain path, because of mine enemies.","Deliver me not over unto the will of mine enemies: for false witnesses are risen up against me, and such as breathe out cruelty.","I had fainted, unless I had believed to see the goodness of the LORD in the land of the living.","Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD."]},
 {n:46,t:"Be still, and know",tag:"Trust",v:["God is our refuge and strength, a very present help in trouble.","Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;","Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof. Selah.","There is a river, the streams whereof shall make glad the city of God, the holy place of the tabernacles of the most High.","God is in the midst of her; she shall not be moved: God shall help her, and that right early.","The heathen raged, the kingdoms were moved: he uttered his voice, the earth melted.","The LORD of hosts is with us; the God of Jacob is our refuge. Selah.","Come, behold the works of the LORD, what desolations he hath made in the earth.","He maketh wars to cease unto the end of the earth; he breaketh the bow, and cutteth the spear in sunder; he burneth the chariot in the fire.","Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.","The LORD of hosts is with us; the God of Jacob is our refuge. Selah."]},
 {n:51,t:"Create in me a clean heart",tag:"Confession",v:["Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","Wash me throughly from mine iniquity, and cleanse me from my sin.","For I acknowledge my transgressions: and my sin is ever before me.","Against thee, thee only, have I sinned, and done this evil in thy sight: that thou mightest be justified when thou speakest, and be clear when thou judgest.","Behold, I was shapen in iniquity; and in sin did my mother conceive me.","Behold, thou desirest truth in the inward parts: and in the hidden part thou shalt make me to know wisdom.","Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.","Make me to hear joy and gladness; that the bones which thou hast broken may rejoice.","Hide thy face from my sins, and blot out all mine iniquities.","Create in me a clean heart, O God; and renew a right spirit within me.","Cast me not away from thy presence; and take not thy holy spirit from me.","Restore unto me the joy of thy salvation; and uphold me with thy free spirit.","Then will I teach transgressors thy ways; and sinners shall be converted unto thee.","Deliver me from bloodguiltiness, O God, thou God of my salvation: and my tongue shall sing aloud of thy righteousness.","O Lord, open thou my lips; and my mouth shall shew forth thy praise.","For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering.","The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.","Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem.","Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar."]},
 {n:63,t:"Early will I seek thee",tag:"Morning",v:["O God, thou art my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;","To see thy power and thy glory, so as I have seen thee in the sanctuary.","Because thy lovingkindness is better than life, my lips shall praise thee.","Thus will I bless thee while I live: I will lift up my hands in thy name.","My soul shall be satisfied as with marrow and fatness; and my mouth shall praise thee with joyful lips:","When I remember thee upon my bed, and meditate on thee in the night watches.","Because thou hast been my help, therefore in the shadow of thy wings will I rejoice.","My soul followeth hard after thee: thy right hand upholdeth me.","But those that seek my soul, to destroy it, shall go into the lower parts of the earth.","They shall fall by the sword: they shall be a portion for foxes.","But the king shall rejoice in God; every one that sweareth by him shall glory: but the mouth of them that speak lies shall be stopped."]},
 {n:91,t:"Under his wings",tag:"Protection",v:["He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.","Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.","He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.","Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;","Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday.","A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee.","Only with thine eyes shalt thou behold and see the reward of the wicked.","Because thou hast made the LORD, which is my refuge, even the most High, thy habitation;","There shall no evil befall thee, neither shall any plague come nigh thy dwelling.","For he shall give his angels charge over thee, to keep thee in all thy ways.","They shall bear thee up in their hands, lest thou dash thy foot against a stone.","Thou shalt tread upon the lion and adder: the young lion and the dragon shalt thou trample under feet.","Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name.","He shall call upon me, and I will answer him: I will be with him in trouble; I will deliver him, and honour him.","With long life will I satisfy him, and shew him my salvation."]},
 {n:100,t:"Enter his gates with thanksgiving",tag:"Praise",v:["Make a joyful noise unto the LORD, all ye lands.","Serve the LORD with gladness: come before his presence with singing.","Know ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.","Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","For the LORD is good; his mercy is everlasting; and his truth endureth to all generations."]},
 {n:103,t:"Bless the Lord, O my soul",tag:"Praise",v:["Bless the LORD, O my soul: and all that is within me, bless his holy name.","Bless the LORD, O my soul, and forget not all his benefits:","Who forgiveth all thine iniquities; who healeth all thy diseases;","Who redeemeth thy life from destruction; who crowneth thee with lovingkindness and tender mercies;","Who satisfieth thy mouth with good things; so that thy youth is renewed like the eagle's.","The LORD executeth righteousness and judgment for all that are oppressed.","He made known his ways unto Moses, his acts unto the children of Israel.","The LORD is merciful and gracious, slow to anger, and plenteous in mercy.","He will not always chide: neither will he keep his anger for ever.","He hath not dealt with us after our sins; nor rewarded us according to our iniquities.","For as the heaven is high above the earth, so great is his mercy toward them that fear him.","As far as the east is from the west, so far hath he removed our transgressions from us.","Like as a father pitieth his children, so the LORD pitieth them that fear him.","For he knoweth our frame; he remembereth that we are dust.","As for man, his days are as grass: as a flower of the field, so he flourisheth.","For the wind passeth over it, and it is gone; and the place thereof shall know it no more.","But the mercy of the LORD is from everlasting to everlasting upon them that fear him, and his righteousness unto children's children;","To such as keep his covenant, and to those that remember his commandments to do them.","The LORD hath prepared his throne in the heavens; and his kingdom ruleth over all.","Bless the LORD, ye his angels, that excel in strength, that do his commandments, hearkening unto the voice of his word.","Bless ye the LORD, all ye his hosts; ye ministers of his, that do his pleasure.","Bless the LORD, all his works in all places of his dominion: bless the LORD, O my soul."]},
 {n:121,t:"I will lift up mine eyes",tag:"Protection",v:["I will lift up mine eyes unto the hills, from whence cometh my help.","My help cometh from the LORD, which made heaven and earth.","He will not suffer thy foot to be moved: he that keepeth thee will not slumber.","Behold, he that keepeth Israel shall neither slumber nor sleep.","The LORD is thy keeper: the LORD is thy shade upon thy right hand.","The sun shall not smite thee by day, nor the moon by night.","The LORD shall preserve thee from all evil: he shall preserve thy soul.","The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore."]},
 {n:130,t:"Out of the depths",tag:"Confession",v:["Out of the depths have I cried unto thee, O LORD.","Lord, hear my voice: let thine ears be attentive to the voice of my supplications.","If thou, LORD, shouldest mark iniquities, O Lord, who shall stand?","But there is forgiveness with thee, that thou mayest be feared.","I wait for the LORD, my soul doth wait, and in his word do I hope.","My soul waiteth for the Lord more than they that watch for the morning: I say, more than they that watch for the morning.","Let Israel hope in the LORD: for with the LORD there is mercy, and with him is plenteous redemption.","And he shall redeem Israel from all his iniquities."]},
 {n:139,t:"Search me, O God",tag:"Confession",v:["O LORD, thou hast searched me, and known me.","Thou knowest my downsitting and mine uprising, thou understandest my thought afar off.","Thou compassest my path and my lying down, and art acquainted with all my ways.","For there is not a word in my tongue, but, lo, O LORD, thou knowest it altogether.","Thou hast beset me behind and before, and laid thine hand upon me.","Such knowledge is too wonderful for me; it is high, I cannot attain unto it.","Whither shall I go from thy spirit? or whither shall I flee from thy presence?","If I ascend up into heaven, thou art there: if I make my bed in hell, behold, thou art there.","If I take the wings of the morning, and dwell in the uttermost parts of the sea;","Even there shall thy hand lead me, and thy right hand shall hold me.","If I say, Surely the darkness shall cover me; even the night shall be light about me.","Yea, the darkness hideth not from thee; but the night shineth as the day: the darkness and the light are both alike to thee.","For thou hast possessed my reins: thou hast covered me in my mother's womb.","I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","My substance was not hid from thee, when I was made in secret, and curiously wrought in the lowest parts of the earth.","Thine eyes did see my substance, yet being unperfect; and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them.","How precious also are thy thoughts unto me, O God! how great is the sum of them!","If I should count them, they are more in number than the sand: when I awake, I am still with thee.","Surely thou wilt slay the wicked, O God: depart from me therefore, ye bloody men.","For they speak against thee wickedly, and thine enemies take thy name in vain.","Do not I hate them, O LORD, that hate thee? and am not I grieved with those that rise up against thee?","I hate them with perfect hatred: I count them mine enemies.","Search me, O God, and know my heart: try me, and know my thoughts:","And see if there be any wicked way in me, and lead me in the way everlasting."]},
 {n:150,t:"Let every thing that hath breath",tag:"Praise",v:["Praise ye the LORD. Praise God in his sanctuary: praise him in the firmament of his power.","Praise him for his mighty acts: praise him according to his excellent greatness.","Praise him with the sound of the trumpet: praise him with the psaltery and harp.","Praise him with the timbrel and dance: praise him with stringed instruments and organs.","Praise him upon the loud cymbals: praise him upon the high sounding cymbals.","Let every thing that hath breath praise the LORD. Praise ye the LORD."]}
];

let saving=false, pendingSave=false;
function plSave(){store.set("plist",PL); if(plRef){pendingSave=true; if(!saving) flushSave();}}
async function flushSave(){
  saving=true; let retried=false;
  while(pendingSave && plRef){
    pendingSave=false;
    try{await plRef.set({people:PL.people,scripture:PL.scripture||{}})}
    catch(e){
      if(e&&e.code==="unavailable"&&!retried){retried=true;pendingSave=true;await new Promise(r=>setTimeout(r,700+Math.random()*800));continue}
      plRef=null; plStatus="Couldn't save to your account. Changes are kept on this device."; rerenderList(); break;
    }
  }
  saving=false;
}
function rerenderList(){ const h=curTab; if((h==="list"||h==="home") && !current) route(); }
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/prayerlist");
    let confirmed=false;
    const timer=setTimeout(()=>{if(!confirmed){plStatus="Can't reach your saved list yet. Showing what's on this device.";rerenderList()}},10000);
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      plRef=ref;
      if(snap.exists){const d=snap.data();PL.people=JSON.parse(JSON.stringify(d.people||[]));PL.scripture=d.scripture&&Object.keys(d.scripture).length?JSON.parse(JSON.stringify(d.scripture)):null;store.set("plist",PL)}
      else if(!snap.metadata.fromCache && !confirmed && (PL.people.length||PL.scripture)) plSave();
      if(!snap.metadata.fromCache){confirmed=true;clearTimeout(timer);plStatus=""}
      rerenderList();
    },()=>{clearTimeout(timer);plRef=null;plStatus="";rerenderList()});
  }catch(e){}
})();

    if(!ts.length) out.push("    Pray as the Spirit leads.");
    ts.forEach(c=>{
      if(!exVerses){return}
      out.push("    "+c.name.toUpperCase());
      out.push("      Pray: "+askFor(c,p));
      scr(c.id).forEach(v=>out.push("      "+v.ref+(v.text?": "+v.text:"")));
    });
    if(!exVerses&&ts.length) out.push("    Praying for: "+ts.map(c=>c.name).join(", "));
    out.push("");
  };
  DAYS_FULL.forEach((d,i)=>{const g=people.filter(p=>!p.once&&p.days.includes(i));if(!g.length)return;out.push("— "+d.toUpperCase()+" —","");g.forEach(block)});
  const none=people.filter(p=>!p.once&&!p.days.length);
  if(none.length){out.push("— NO DAY SET —","");none.forEach(block)}
  const once=people.filter(p=>p.once).sort((a,b)=>a.once.localeCompare(b.once));
  once.forEach(p=>{out.push("— ONE TIME · "+niceDate(p.once).toUpperCase()+" —","");block(p)});
  return out.join("\n");
}

      types:Array.isArray(p.types)?p.types.filter(t=>CATS.some(c=>c.id===t)):[],note:typeof p.note==="string"?p.note.slice(0,2000):""};
    if(typeof p.once==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(p.once)){o.once=p.once;o.days=[]}

    if(!restoreArm&&!t.hasAttribute("data-armed")){restoreArm=true;route();return}
    PL.people=restoreData.people; PL.scripture=Object.keys(restoreData.scripture).length?restoreData.scripture:null;
    const n=PL.people.length; plSave(); restoreData=null; restoreArm=false; restoreDone="Restored "+n+" name"+(n===1?"":"s")+" from your backup."; route(); return;
  }
  if(ds.exf){exFmt=ds.exf;store.set("exFmt",exFmt);route();return}
  if(t.hasAttribute("data-exsave")){
    if(!dl) return;
    dl.save({filename:exName(),data:exportData(exFmt)})
      .then(()=>exMsg("Saved."))
      .catch(err=>{const c=err&&err.code;
        if(c==="declined") return;
        if(c==="rate_limited") exMsg("A save is already waiting for you to confirm.");
        else exMsg("This view can't save files. Use Copy text instead.");});
    return;
  }
  if(t.hasAttribute("data-excopy")){
    const ta=$("#expreview"), txt=exportData(exFmt);
    const fallback=()=>{ta.focus();ta.select();exMsg("Text selected. Copy it with your device's Copy command.")};
    try{navigator.clipboard.writeText(txt).then(()=>exMsg("Copied. Paste it into an email, note, or document."),fallback)}catch(e){fallback()}
    return;
  }
  if(ds.lv){listView=ds.lv;store.set("listView",listView);route();return}
  if(ds.day!==undefined){selDay=+ds.day;route();return}
  if(ds.edit){openEditor(ds.edit);return}
  if(ds.praydays!==undefined){current=["d",ds.praydays];stepIdx=0;showReader();return}
  if(ds.tday!==undefined){toggle(draft.days,+ds.tday);renderReader();return}
  if(ds.tcat){toggle(draft.types,ds.tcat);renderReader();return}
  if(ds.kind){draft.kind=ds.kind;renderReader();return}
  if(ds.sched){draft.once=ds.sched==="once"?(draft.once||ymd(new Date())):null;renderReader();return}
  if(t.hasAttribute("data-alldays")){draft.days=draft.days.length===7?[]:[0,1,2,3,4,5,6];renderReader();return}
  if(t.hasAttribute("data-savep")){
    draft.name=draft.name.trim();
    if(!draft.name){const er=$("#perr");er.textContent="Add a name to save.";er.hidden=false;$("#pname").focus();return}
    if(draft.once===""){const er=$("#perr");er.textContent="Pick a date for this one-time prayer.";er.hidden=false;return}
    if(draft.once) draft.days=[]; else delete draft.once;
    const i=PL.people.findIndex(p=>p.id===draft.id);
    i>=0?PL.people[i]=draft:PL.people.push(draft);
    plSave(); current=["v",draft.id]; draft=null; showReader(); return;
  }
  if(t.hasAttribute("data-delp")){
    if(!delArm){delArm=true;renderReader();return}
    PL.people=PL.people.filter(p=>p.id!==draft.id); plSave(); closeReader(); return;
  }
  if(ds.cat){openCat=openCat===ds.cat?null:ds.cat;resetArm=null;route();return}
  if(ds.addv){const c=ds.addv,ri=$("#vref-"+c),r=ri.value.trim(),tx=$("#vtext-"+c).value.trim();
    if(!r){ri.focus();return}
    ensureScr(c).push({ref:r,text:tx}); plSave(); route(); return}
  if(ds.rmv){const [c,i]=ds.rmv.split(":");ensureScr(c).splice(+i,1);plSave();route();return}
  if(ds.reset){
    if(resetArm!==ds.reset){resetArm=ds.reset;route();return}
    if(PL.scripture){delete PL.scripture[ds.reset];if(!Object.keys(PL.scripture).length)PL.scripture=null}
    resetArm=null; plSave(); route(); return;
  }
});
document.addEventListener("change",e=>{if(e.target.id==="rfile"&&e.target.files&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>loadBackup(String(fr.result||""));fr.onerror=()=>{restoreErr="That file couldn't be read.";route()};fr.readAsText(e.target.files[0]);return}
  if(e.target.id==="ext"){exToday=e.target.checked;store.set("exToday",exToday);const ta=$("#expreview");if(ta)ta.value=exportData(exFmt)}
  if(e.target.id==="exv"){exVerses=e.target.checked;store.set("exVerses",exVerses);const ta=$("#expreview");if(ta)ta.value=exportData(exFmt)}});
document.addEventListener("input",e=>{
  const id=e.target.id||"";
  if(id==="pname"&&draft) draft.name=e.target.value;
  if(id==="pnote"&&draft) draft.note=e.target.value;
  if(id==="ponce"&&draft) draft.once=e.target.value;
  if(id.startsWith("vref-")){const a=$("#vlook-"+id.slice(5)); if(a) a.href=e.target.value.trim()?bgLink(e.target.value.trim(),"NKJV"):"https://www.biblegateway.com/"}
});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-filter],[data-mode],[data-step],[data-close],[data-again],[data-switch]");
  if(!t) return;
  if(t.dataset.open){openItem(t.dataset.open);return}
  if(t.dataset.filter){prayerFilter=t.dataset.filter;route();return}
  if(t.dataset.mode){mode=t.dataset.mode;stepIdx=0;renderReader();return}
  if(t.dataset.switch){current=["o","pray"];stepIdx=0;renderReader();return}
  if(t.dataset.step){stepIdx=Math.max(0,stepIdx+ +t.dataset.step);renderReader();$("#reader").scrollTop=0;return}
  if(t.hasAttribute("data-again")){stepIdx=0;renderReader();return}
  if(t.hasAttribute("data-close")){closeReader();return}
});
$("#back").onclick=closeReader;
$("#fav").onclick=()=>{
  const k=current[0]+":"+current[1];
  favs.has(k)?favs.delete(k):favs.add(k);
  store.set("favs",[...favs]); renderReader();
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&current)closeReader()});

route();
</script>

.installtip button{background:none;border:0;font-size:18px;color:var(--muted);padding:6px;cursor:pointer}
</style>
<script>
(function(){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  var dismissed=false; try{dismissed=localStorage.getItem("pb_installTip")==="no"}catch(e){}
  var tip=document.getElementById("installTip");
  if(ios&&!standalone&&!dismissed) tip.hidden=false;
  document.getElementById("itClose").onclick=function(){tip.hidden=true;try{localStorage.setItem("pb_installTip","no")}catch(e){}};
  if("serviceWorker" in navigator) window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
